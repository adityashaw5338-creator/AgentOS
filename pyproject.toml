[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-engine"
version = "0.1.0"
description = "A modular agent engine with validated tools, persisted workflows, and a local dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "SQLAlchemy>=2.0,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1.2,<2", "ruff>=0.9,<1"]

[project.scripts]
agentos = "agent_engine.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["agent_engine*"]

[tool.setuptools.package-data]
agent_engine = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
