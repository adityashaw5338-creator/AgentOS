name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check agent_engine tests
      - run: python -m build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Install browser test dependencies
        run: npm install --prefix .verification/browser --no-save --package-lock=false --ignore-scripts playwright@1.64.1
      - name: Install Chromium
        run: node .verification/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify dashboard and browser regressions
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/.verification/browser/node_modules/playwright
          AGENTOS_TEST_PYTHON: python
        run: node scripts/verify-browser.cjs
      - name: Save browser verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            .verification/dashboard/
            .verification/browser-results/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
